name: Build Android TWA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write Bubblewrap config
        run: |
          mkdir -p "$HOME/.bubblewrap"
          python3 - <<'PY'
          import json, os
          jdk = os.environ["JAVA_HOME"]
          sdk = os.environ.get("ANDROID_SDK_ROOT") or os.environ["ANDROID_HOME"]
          cfg = {"jdkPath": jdk, "androidSdkPath": sdk}
          path = os.path.expanduser("~/.bubblewrap/config.json")
          with open(path, "w") as f:
              json.dump(cfg, f)
          print(cfg)
          PY

      - name: Install Bubblewrap core
        run: npm install --no-save --prefix "$HOME/bw" @bubblewrap/core

      - name: Prepare signing keystore
        env:
          KS_B64: ${{ secrets.DAFTARY_KEYSTORE_BASE64 }}
        run: |
          mkdir -p twa-android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > twa-android/android.keystore
            echo "Using repository signing keystore"
            echo "TWA_KEYSTORE_ALIAS=daftary_key" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore twa-android/android.keystore \
              -alias android -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Daftary, OU=Dev, O=Daftary, L=Cairo, ST=Cairo, C=EG"
            echo "Generated CI keystore (sideload only; Play Store needs DAFTARY_KEYSTORE_BASE64)"
            echo "TWA_KEYSTORE_ALIAS=android" >> "$GITHUB_ENV"
          fi
          echo "TWA_KEYSTORE_PATH=$GITHUB_WORKSPACE/twa-android/android.keystore" >> "$GITHUB_ENV"

      - name: Generate TWA Android project
        run: |
          export NODE_PATH="$HOME/bw/node_modules"
          node scripts/generate-twa.mjs

      - name: Build release APK
        working-directory: twa-android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.DAFTARY_KS_PASS }}
          KEY_PASS: ${{ secrets.DAFTARY_KEY_PASS }}
        run: |
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          UNSIGNED=$(find twa-android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "No APK produced" >&2
            find twa-android -name "*.apk" || true
            exit 1
          fi
          echo "Signing $UNSIGNED"
          STORE_PASS="${KS_PASS:-android}"
          KEY_PASS_USE="${KEY_PASS:-android}"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" Daftary-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks twa-android/android.keystore \
            --ks-key-alias "${TWA_KEYSTORE_ALIAS}" \
            --ks-pass "pass:${STORE_PASS}" \
            --key-pass "pass:${KEY_PASS_USE}" \
            --out Daftary.apk \
            Daftary-aligned.apk
          "$BUILD_TOOLS/apksigner" verify Daftary.apk
          ls -lh Daftary.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daftary
          path: Daftary.apk
          if-no-files-found: error
